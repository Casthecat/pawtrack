# Isolated local portfolio demo. This database is discarded when the server stops.
server:
  address: 127.0.0.1
  port: 9090
spring:
  datasource:
    url: jdbc:h2:mem:pawtrack-demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    org.hibernate.SQL: info
