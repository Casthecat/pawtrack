# Public portfolio fixtures only. Never use this profile with real applicant data.
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
upload:
  path: /app/uploads/
pawtrack:
  demo:
    database-acknowledgement: ${PAWTRACK_DEMO_DATABASE_ACK:}
logging:
  level:
    org.hibernate.SQL: info
