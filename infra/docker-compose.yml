services:
  db:
    image: postgres:16
    container_name: pawtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawtrack
      POSTGRES_USER: pawtrack
      POSTGRES_PASSWORD: pawtrack
    ports:
      - "5432:5432"
    volumes:
      - pawtrack_db_data:/var/lib/postgresql/data

volumes:
  pawtrack_db_data:
